<svg viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg"
     preserveAspectRatio="xMidYMid meet">

  <defs>
    <!-- Circle glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#00D4FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00A0CC" stop-opacity="0"/>
    </radialGradient>

    <!-- Wave gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00B8FF"/>
    </linearGradient>

    <style><![CDATA[
      .circle-outline {
        stroke: #4FFFFF;
        stroke-width: 6;
        fill: none;
        animation: pulseOutline 2.5s ease-in-out infinite;
      }
      .circle-glow {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .wave {
        stroke: url(#waveGrad);
        stroke-width: 6;
        fill: none;
        animation: waveMove 4s ease-in-out infinite;
      }
      .wave:nth-of-type(2) {
        animation-delay: 0.4s;
      }
      .wave:nth-of-type(3) {
        animation-delay: 0.8s;
      }
      .init-text {
        fill: #4FFFFF;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 40px;
        text-anchor: middle;
        animation: textPulse 3s ease-in-out infinite;
      }

      @keyframes pulseGlow {
        0%   { opacity: 0.7; transform: scale(1); }
        50%  { opacity: 1;   transform: scale(1.08); }
        100% { opacity: 0.7; transform: scale(1); }
      }
      @keyframes pulseOutline {
        0%   { stroke-width: 5; }
        50%  { stroke-width: 8; }
        100% { stroke-width: 5; }
      }
      @keyframes waveMove {
        0%   { transform: translateX(0); opacity: 0.9; }
        50%  { transform: translateX(10px); opacity: 1; }
        100% { transform: translateX(0); opacity: 0.9; }
      }
      @keyframes textPulse {
        0%   { opacity: 0.4; }
        50%  { opacity: 1; }
        100% { opacity: 0.4; }
      }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#050814"/>

  <!-- Glowing circle -->
  <g transform="translate(512 320)">
    <circle r="120" class="circle-glow" fill="url(#glow)"/>
    <circle r="90" class="circle-outline"/>
  </g>

  <!-- Waves -->
  <g>
    <path class="wave"
          d="M 200 460 C 320 430 420 490 512 460
             C 604 430 704 490 824 460" />
    <path class="wave"
          d="M 200 500 C 320 470 420 530 512 500
             C 604 470 704 530 824 500" />
    <path class="wave"
          d="M 200 540 C 320 510 420 570 512 540
             C 604 510 704 570 824 540" />
  </g>

  <!-- Text -->
  <text x="512" y="640" class="init-text">
    System Initializing…
  </text>
</svg>
